<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <meta name="description" content="">
        <meta name="author" content="">

        <title>Cristi Cafe</title>
        <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
        <style>
        /* Stiluri de bază */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f0e8;
            color: #333;
            scroll-behavior: smooth;
        }
        
        /* Header și navigare */
        header {
            background-color: #5d4037;
            color: white;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        
        .nav-links {
            display: flex;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            padding: 5px;
        }
        
        .nav-links a:hover {
            text-decoration: underline;
        }
        
        .reservation-btn {
            background-color: transparent;
            border: 1px solid white;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            margin-left: 20px;
        }
        
        /* Secțiuni comune */
        section {
            padding: 60px 20px;
            scroll-margin-top: 70px; /* Pentru a compensa header-ul sticky */
        }
        
        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .section-title h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .section-title p {
            color: #666;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Hero section */
        #home {
            background-color: #8d6e63;
            color: white;
            padding: 40px 20px;
        }
        
        .hero-content {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        @media (min-width: 768px) {
            .hero-content {
                flex-direction: row;
            }
        }
        
        .hero-image {
            flex: 1;
            position: relative;
            min-height: 300px;
            background-color: #a1887f;
            margin-bottom: 20px;
        }
        
        @media (min-width: 768px) {
            .hero-image {
                margin-bottom: 0;
                margin-right: 20px;
            }
        }
        
        .hero-text-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
        }
        
        .hero-text-overlay h2 {
            margin: 0;
            font-size: 24px;
        }
        
        .hero-text-overlay p {
            margin: 5px 0 0 0;
            font-size: 18px;
        }
        
        .hero-info {
            flex: 1;
            padding: 20px;
        }
        
        .hero-info h1 {
            margin-top: 0;
        }
        
        .hero-info p {
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .meet-btn {
            display: inline-block;
            background-color: transparent;
            border: 1px solid white;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 15px;
        }
        
        /* Despre noi */
        #about {
            background-color: white;
        }
        
        .about-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        @media (min-width: 768px) {
            .about-content {
                flex-direction: row;
            }
        }
        
        .about-text {
            flex: 1;
        }
        
        .about-text p {
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .about-image {
            flex: 1;
            background-color: #ddd;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }
        
        /* Valori */
        .values-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 40px;
        }
        
        @media (min-width: 768px) {
            .values-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        .value-item {
            background-color: #f9f5f1;
            border-radius: 5px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .value-icon {
            width: 60px;
            height: 60px;
            background-color: #ede7e3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }
        
        .value-item h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        
        .value-item p {
            margin: 0;
            color: #666;
        }
        
        /* Meniu */
        #menu {
            background-color: #f5f0e8;
        }
        
        .menu-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .menu-tab {
            padding: 10px 20px;
            background-color: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin: 0 5px 10px;
            border-bottom: 2px solid transparent;
        }
        
        .menu-tab.active {
            border-bottom: 2px solid #8d6e63;
            font-weight: bold;
        }
        
        .menu-content {
            display: none;
        }
        
        .menu-content.active {
            display: block;
        }
        
        .menu-items {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        
        @media (min-width: 768px) {
            .menu-items {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .menu-item {
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
            background-color: white;
        }
        
        .menu-item-content {
            padding: 15px;
        }
        
        .menu-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .menu-item-header h3 {
            margin: 0;
        }
        
        .menu-item-price {
            color: #8d6e63;
            font-weight: bold;
        }
        
        .menu-item-description {
            color: #666;
        }
        
        /* Team section */
        #team {
            background-color: #bcaaa4;
            color: white;
            text-align: center;
        }
        
        .team-members {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .team-member {
            width: 100%;
            max-width: 250px;
            background-color: white;
            color: #333;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .member-photo {
            height: 200px;
            background-color: #a1887f;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .member-info {
            padding: 15px;
        }
        
        .member-info h3 {
            margin-top: 0;
            margin-bottom: 5px;
        }
        
        .member-info p {
            margin: 0;
            color: #666;
        }
        
        /* Rezervări */
        #reservations {
            background-color: white;
        }
        
        .reservation-form {
            max-width: 800px;
            margin: 0 auto;
            background-color: #f9f5f1;
            border-radius: 5px;
            padding: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        
        .form-group textarea {
            height: 100px;
            resize: vertical;
        }
        
        .form-row {
            display: flex;
            gap: 20px;
            flex-direction: column;
        }
        
        @media (min-width: 768px) {
            .form-row {
                flex-direction: row;
            }
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .submit-btn {
            background-color: #8d6e63;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        
        .submit-btn:hover {
            background-color: #6d4c41;
        }
        
        /* Contact */
        #contact {
            background-color: #f5f0e8;
        }
        
        .contact-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        @media (min-width: 768px) {
            .contact-container {
                flex-direction: row;
            }
        }
        
        .contact-info {
            flex: 1;
            background-color: white;
            border-radius: 5px;
            padding: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .contact-form {
            flex: 1;
            background-color: white;
            border-radius: 5px;
            padding: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .contact-info h3 {
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #8d6e63;
            padding-bottom: 10px;
        }
        
        .info-item {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
        }
        
        .info-icon {
            width: 40px;
            height: 40px;
            background-color: #ede7e3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        .info-text h4 {
            margin: 0 0 5px 0;
        }
        
        .info-text p {
            margin: 0;
            color: #666;
        }
        
        /* Program */
        .hours {
            margin-top: 30px;
        }
        
        .hours h4 {
            margin-top: 0;
            margin-bottom: 15px;
        }
        
        .hours-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        /* Contact form */
        .contact-form h3 {
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #8d6e63;
            padding-bottom: 10px;
        }
        
        /* Footer */
        footer {
            background-color: #5d4037;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        /* Utilități */
        .hidden {
            display: none;
        }
        
        /* Mesaje de succes/eroare */
        .message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        /* Buton de scroll sus */
        .scroll-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background-color: #8d6e63;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 99;
        }
        
        .scroll-top.visible {
            opacity: 1;
        }
    </style>
        
    </head>
    
    <body class="reservation-page">
                
            <main>
                <!-- Header cu navigare -->
   
                <header>
                    <div class="navbar">
                        <div class="logo">Cristi Cafe</div>
                        <div class="nav-links">
                            <a href="index.html#home">Acasă</a>
                            <a href="index.html#about">Despre</a>
                            <a href="index.html#menu">Meniu</a>
                            <a href="index.html#team">Echipa</a>
                            <a href="contact.html">Contact</a>
                            <a href="reservation.html" class="reservation-btn">Rezervare</a>
                        </div>
                    </div>
                </header>

                

                <section class="booking-section section-padding">
                <div class="container">
                    <div class="row">

                        <div class="col-lg-10 col-12 mx-auto">
                            <div class="booking-form-wrap">
                                <div class="row">
                                    <div class="col-lg-7 col-12 p-0">
                                        <div class="contact-form">
                                            <h3>Trimite-ne un Mesaj</h3>
                                            <form id="bookingForm">
                                                <div class="form-group">
                                                    <label for="name">Nume</label>
                                                    <input type="text" id="name" name="name" required>
                                                </div>
                                                <div class="form-group">
                                                    <label for="email">Email</label>
                                                    <input type="email" id="email" name="email" required>
                                                </div>
                                                <div class="form-group">
                                                    <label for="message">Mesaj</label>
                                                    <textarea id="message" name="message" rows="4" required></textarea>
                                                </div>
                                                <button type="button" class="submit-btn" id="submitBtn">Trimite Mesajul</button>
                                            </form>
                                        </div>
                                    </div>

                                    <!-- Replace the map column markup to match the style of the contact form -->

                                    <div class="col-lg-5 col-12 p-0">
                                        <div class="contact-form" style="height:100%;display:flex;flex-direction:column;justify-content:center;">
                                            <h3 style="border-bottom:2px solid #8d6e63;padding-bottom:10px;margin-top:0;margin-bottom:20px;">Ne găsești aici</h3>
                                            <div style="flex:1;display:flex;align-items:center;">
                                                <iframe 
                                                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5563.549135053072!2d24.14534199513826!3d45.79574388432474!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x474c6790fd6c0f07%3A0x11abadda97d3fd9b!2sThe%20Upper%20Town%2C%20Sibiu!5e0!3m2!1sen!2sro!4v1737038912460!5m2!1sen!2sro" 
                                                    width="100%" 
                                                    height="320" 
                                                    style="border:0; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.07);" 
                                                    allowfullscreen="" 
                                                    loading="lazy" 
                                                    referrerpolicy="no-referrer-when-downgrade">
                                                </iframe>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </section>


                <footer>
        <p>&copy; 2023 Cristi Cafe. Toate drepturile rezervate.</p>
    </footer>

        <!-- Buton de scroll sus -->
        <a href="#" class="scroll-top" id="scrollTop">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        </a>
    </main>


        <!-- JAVASCRIPT FILES -->
        <script>
            document.getElementById('submitBtn').addEventListener('click', async () => {
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true; // Disable the button immediately
                submitBtn.innerHTML = 'Sending...'; // Change button text to indicate sending	

                const formData = {
                    name: document.getElementById("name").value,
                    email: document.getElementById("email").value,
                    message: document.getElementById("message").value,
                    };
    
                try {
                    const response = await fetch('https://npft1r7xse.execute-api.us-east-1.amazonaws.com/dev/contact', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData),
                    });
    
                    if (response.ok) {
                        const result = await response.json();
                        alert('Message sent!');//+ JSON.stringify(result)
                        window.location.href = 'index.html'; // Redirect to a thank you page or home page
                    } else {
                        const error = await response.text();
                        alert('Error: ' + error);
                    }
                } catch (err) {
                    console.error('Error:', err);
                    alert('Failed to send the message. Please try again.');
                } finally {
                    submitBtn.disabled = false; // Re-enable the button after response or error
                }
            });
                        
        </script>
        
    </body>
</html>
